# Traefik ACME / Let's Encrypt configuration
# Applied by qos-cluster-app enable when CF_DNS_API_TOKEN is set in cluster-app.conf
# Uses Cloudflare DNS-01 challenge to issue wildcard certificates.
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-cf-token
  namespace: kube-system
type: Opaque
stringData:
  CF_DNS_API_TOKEN: "REPLACE_CF_TOKEN"
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    persistence:
      enabled: true
      size: 128Mi
      path: /data
    env:
      - name: CF_DNS_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: traefik-cf-token
            key: CF_DNS_API_TOKEN
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=REPLACE_ACME_EMAIL"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    ports:
      websecure:
        tls:
          enabled: true
          certResolver: letsencrypt
          domains:
            - main: "REPLACE_WILDCARD_DOMAIN"
