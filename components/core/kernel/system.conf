# System management: power, timing, device discovery, monitoring

# ============================================================
# PCI
# ============================================================
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_PCI_ATS=n
CONFIG_PCI_PRI=n
CONFIG_PCI_PASID=n

# ============================================================
# ACPI (hardware discovery)
# ============================================================
CONFIG_ACPI=y
CONFIG_ACPI_PCI=y
CONFIG_ACPI_PROCESSOR=y
CONFIG_ACPI_NUMA=y
CONFIG_PCCP=y

# ============================================================
# CPU Frequency Scaling (power management)
# ============================================================
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_ACPI_CPUFREQ=n

# ============================================================
# RTC (real-time clock for hardware)
# ============================================================
CONFIG_RTC_CLASS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"
CONFIG_RTC_DRV_EFI=y

# ============================================================
# Hardware Monitoring (modules)
# ============================================================
CONFIG_HWMON=n
CONFIG_SENSORS_CORETEMP=n
CONFIG_SENSORS_K10TEMP=n
