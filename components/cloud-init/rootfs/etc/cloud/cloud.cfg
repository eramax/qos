# The top level settings are used as module
# and base configuration.

# A set of users which may be applied and/or used by various modules
# when a 'default' entry is found it will reference the 'default_user'
# from the distro configuration specified below
users:
  - default

# Root password login is enabled for this minimal VPS
disable_root: false

mount_default_fields: [~, ~, 'auto', 'defaults,nofail', '0', '2']
ssh_pwauth: true

# This will cause the set+update hostname module to not operate (if true)
preserve_hostname: false

# Keep the image generic: prefer local seed/config-drive initialization when
# available, then EC2/IMDSv2 for cloud VMs, then fall back to DHCP.
datasource_list: [ ConfigDrive, NoCloud, Ec2, None ]

# EC2 datasource configuration (for AWS, EC2-compatible clouds)
datasource:
  Ec2:
    metadata_urls: [ 'http://169.254.169.254' ]
    timeout: 5 # (defaults to 50 seconds)
    max_wait: 10 # (defaults to 120 seconds)

# The modules that run in the 'init' stage
cloud_init_modules:
  - seed_random
  - bootcmd
  - write_files
  - growpart
  - resizefs
  - disk_setup
  - mounts
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - resolv_conf
  - ca_certs
  - rsyslog
  - users_groups
  - ssh
  - set_passwords

# The modules that run in the 'config' stage
cloud_config_modules:
  - ssh_import_id
  - keyboard
  - locale
  - apk_configure
  - ntp
  - timezone
  # EC2 metadata enabled (see datasource_list above)
  # - disable_ec2_metadata
  - runcmd

# The modules that run in the 'final' stage
cloud_final_modules:
  - package_update_upgrade_install
  - write_files_deferred
  - puppet
  - chef
  - ansible
  - mcollective
  - salt_minion
  - scripts_vendor
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - ssh_authkey_fingerprints
  - keys_to_console
  - install_hotplug
  - phone_home
  - final_message
  - power_state_change

# System and/or distro specific settings
# (not accessible to handlers/transforms)
system_info:
  # This will affect which distro class gets used
  distro: alpine
  # Default user name + that default users groups (if added/used)
  default_user:
    name: alpine
    lock_passwd: True
    gecos: alpine Cloud User
    groups: [adm, wheel]
    doas:
      - permit nopass alpine
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/ash
  network:
    renderers: ['eni']
  # Other config here will be given to the distro class and/or path classes
  paths:
    cloud_dir: /var/lib/cloud/
    templates_dir: /etc/cloud/templates/
  ssh_svcname: sshd
