# cluster-info dashboard manifests
# Applied by qos-cluster-app enable — the ConfigMap (server.py) is created
# separately from /usr/share/qos/cluster-app/server.py before this file.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-info
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-info-reader
rules:
- apiGroups: [""]
  resources: [nodes, pods, services, namespaces, events, persistentvolumes, persistentvolumeclaims]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, daemonsets, statefulsets, replicasets]
  verbs: [get, list, watch]
- apiGroups: [metrics.k8s.io]
  resources: [nodes, pods]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-info-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-info-reader
subjects:
- kind: ServiceAccount
  name: cluster-info
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-info
  namespace: default
  labels:
    app: cluster-info
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-info
  template:
    metadata:
      labels:
        app: cluster-info
    spec:
      serviceAccountName: cluster-info
      containers:
      - name: server
        image: python:3-alpine
        command: [python3, /app/server.py]
        ports:
        - containerPort: 80
        env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_IP
          valueFrom: {fieldRef: {fieldPath: status.podIP}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: NODE_IP
          valueFrom: {fieldRef: {fieldPath: status.hostIP}}
        - name: NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        volumeMounts:
        - name: script
          mountPath: /app/server.py
          subPath: server.py
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: script
        configMap:
          name: cluster-info-script
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-info
  namespace: default
spec:
  selector:
    app: cluster-info
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-info
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: "CLUSTER_INFO_HOST"
spec:
  ingressClassName: traefik
  rules:
  - host: CLUSTER_INFO_HOST
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cluster-info
            port:
              number: 80
