# QOS unified system manifest.
#
# Current status: generator input, not yet authoritative.
#
# `make manifest-gen` reads this file and emits files into build/generated/
# that match the existing inputs under config/apk/ and config/image/. The
# build pipeline still reads the source-of-truth files, not the generated
# ones. `make manifest-diff` compares the two so we can prove this manifest
# is sufficient to reproduce the current build before flipping authority.
#
# Schema version is bumped whenever incompatible changes happen.
# See docs/FEATURE-REVIEW-AND-IDEAS.md section 2.4 for design rationale.

schema_version: 1

image:
  variant: stable
  format: raw
  size: 384M
  partition_table: gpt
  boot_mode: uefi
  ab: true            # A/B root slots for OTA
  install_tool: qos-install

# Default workload profile baked into the image. Run-time profile is read
# from /etc/qos/profile (writable on the state partition); the value here
# is only the factory default.
profile: server

# Alpine repositories the image is built from. Pin to a snapshot URL once
# byte-reproducibility becomes a hard requirement (review §4).
repositories:
  - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
  - https://dl-cdn.alpinelinux.org/alpine/v3.23/community

packages:
  # Absolute minimum for a bootable system.
  base:
    - alpine-baselayout
    - alpine-keys
    - apk-tools
    - busybox
    - ca-certificates
    - musl
    - tzdata

  # Server-grade essentials. Everything below should be justifiable against
  # the <64MB target in docs/RAM-MINIMIZATION-GUIDE.md.
  # NB: `packages.system` is the "server profile" baseline. Other profiles
  # extend it via the `profiles:` section below.
  system:
    - curl
    - dropbear
    - iproute2
    - ifupdown-ng
    - nftables
    - execline
    - s6-linux-init
    - s6-portable-utils
    - s6-rc
    - gcompat
    - htop
    - dcron
    - qemu-guest-agent
    - cloud-init
    - e2fsprogs
    - e2fsprogs-extra
    - dosfstools
    - sgdisk
    - mtools

# Partition layout. Mirrors config/image/layout.json today; the generator
# emits a JSON file from this section that scripts/assemble-image.sh can
# consume unchanged.
partitions:
  - name: efi
    filesystem: vfat
    mount: /boot/efi
    size: 64M
    description: "EFI partition with Limine bootloader, kernel, initramfs"
  - name: root-a
    filesystem: ext4
    mount: /
    slot: A
    immutable: true
    size: 128M
    description: "Immutable root filesystem slot A (enough for dev tools)"
  - name: root-b
    filesystem: ext4
    mount: /
    slot: B
    immutable: true
    size: 128M
    description: "Immutable root filesystem slot B (for OTA updates)"

  - name: state
    filesystem: ext4
    mount: /var
    mutable: true
    size: auto
    description: "State partition (auto-sized from remaining space)"

# Service enable list lives here once install-services.sh is parameterized;
# for now this is informational only. Generator emits no file from it yet.
services:
  enable:
    - s6-linux-init
    - dropbear
    - networking
    - nftables
    - cloud-init
    - qemu-guest-agent

# Workload-profile deltas. Each profile = base + system + its own packages
# and services. Schema only today; nothing in the build consumes these yet.
# The plan (review §2.6) is for profiles to be applied as overlay squashfs
# layers — see docs/WORKLOAD-PROFILES-GUI-GAMING-K8S.md.
profiles:
  # Two profiles only — see review §2.6 plus operator decision 2026-05-12.
  # `server` is a cluster-capable headless image; k3s/k9s are installed
  # but the service is NOT enabled by default (start via `qos cluster
  # enable`). `desktop` is the full Wayland + Chromium + Steam stack.
  server:
    description: "Headless / cluster-capable / cloud. k3s installed, off by default."
    packages:
      - k3s
      - k9s
      - cni-plugins
      - conntrack-tools
      - iptables
    services: []               # k3s-server staged but not auto-started
    # No GPU support. Modules and firmware are pruned from the rootfs
    # at build time. See docs/GPU-DRIVERS.md.
    gpu:
      kernel_modules: []
      firmware: []
    ram_budget_kb: 131072      # 128 MB (64 MB idle + ~64 MB headroom for k3s when started)

  desktop:
    description: "Wayland + Chromium WebView + Steam, with open-source GPU stack."
    packages:
      - wayland
      - sway
      - foot
      - chromium
      - mesa
      - mesa-gl
      - mesa-egl
      - mesa-vulkan-ati
      - mesa-vulkan-intel
      - pipewire
      - pipewire-pulse
      - seatd
      - eudev
      - flatpak                # Steam ships via flathub
      # gamemode: not in Alpine main/community as of 3.23 — install
      # post-boot from edge/testing or skip; not a hard dep for boot.
    services:
      - seatd
      - eudev
      - pipewire
      - xwayland
      - swaybg
    overlays:
      - lib32                  # 32-bit libs for Proton/Steam, in own overlay
    # Open-source stack only. NVIDIA proprietary is a separate overlay
    # never baked into the base profile (licensing).
    gpu:
      kernel_modules:
        - drivers/gpu/drm
        - drivers/gpu/drm/amd
        - drivers/gpu/drm/radeon
        - drivers/gpu/drm/i915
        - drivers/gpu/drm/nouveau
        - drivers/gpu/drm/virtio
      firmware:
        - linux-firmware-amdgpu
        - linux-firmware-radeon
        - linux-firmware-i915
    ram_budget_kb: 524288      # 512 MB
