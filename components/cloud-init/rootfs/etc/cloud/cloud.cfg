# The top level settings are used as module
# and base configuration.

# A set of users which may be applied and/or used by various modules
# when a 'default' entry is found it will reference the 'default_user'
# from the distro configuration specified below
users:
  - default
  - name: root

# Root password login is enabled for this minimal VPS
disable_root: false

mount_default_fields: [~, ~, 'auto', 'defaults,nofail', '0', '2']
ssh_pwauth: true

# Explicit password for the default user so SSH works out of the box.
chpasswd:
  expire: false
  list:
    - emo:emo2500

# Disable package operations on live/installed systems.
package_update: false
package_upgrade: false
package_reboot_if_required: false

# This will cause the set+update hostname module to not operate (if true)
preserve_hostname: false

# Datasource priority: Broadened for maximum VPS compatibility.
datasource_list: [ NoCloud, ConfigDrive, OpenStack, DigitalOcean, CloudStack, Ec2, None ]

datasource:
  Ec2:
    metadata_urls: [ 'http://169.254.169.254' ]
    timeout: 3
    max_wait: 5

# Don't let cloud-init manage SSH — QOS uses Dropbear + s6, not OpenSSH + OpenRC.
ssh_genkeytypes: []

# Don't let cloud-init try to resize overlayfs root.
resize_rootfs: false

# The modules that run in the 'init' stage
cloud_init_modules:
  - seed_random
  - bootcmd
  - write_files
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - ca_certs
  - rsyslog
  - users_groups
  - ssh

# The modules that run in the 'config' stage
cloud_config_modules:
  - ssh_import_id
  - keyboard
  - locale
  - apk_configure
  - ntp
  - timezone
  - runcmd

# The modules that run in the 'final' stage
cloud_final_modules:
  - write_files_deferred
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - final_message
  - power_state_change

# System and/or distro specific settings
# (not accessible to handlers/transforms)
system_info:
  # This will affect which distro class gets used
  distro: alpine
  # Default user name + that default users groups (if added/used)
  default_user:
    name: emo
    lock_passwd: False
    gecos: QOS User
    groups: [adm, wheel, audio, video, input]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/sh
  network:
    config: disabled
  # Other config here will be given to the distro class and/or path classes
  paths:
    cloud_dir: /var/lib/cloud/
    templates_dir: /etc/cloud/templates/
  ssh_svcname: sshd
