flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0;
    policy accept;  # TODO: tighten once ct state (nf_conntrack) is confirmed working
  }

  chain forward {
    type filter hook forward priority 0;
    policy drop;
  }

  chain output {
    type filter hook output priority 0;
    policy accept;
  }
}
