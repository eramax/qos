flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0;
    policy drop;

    # Loopback is always allowed
    iif lo accept

    # Allow established and related connections
    ct state established,related accept

    # Allow DHCP client (responses from DHCP server on UDP 67→68)
    udp sport 67 udp dport 68 accept

    # Allow ICMP (Ping) - Rate limited to 10/second to prevent flood
    icmp type echo-request limit rate 10/second accept
    icmpv6 type echo-request limit rate 10/second accept

    # Allow SSH (port 22) - Rate limited to 10 connections per minute per IP
    # to protect against brute-force attacks.
    tcp dport 22 meter ssh_meter { ip saddr limit rate 10/minute } accept

    # Allow Web (ports 80 and 443)
    tcp dport { 80, 443 } accept
  }

  chain forward {
    type filter hook forward priority 0;
    policy drop;
  }

  chain output {
    type filter hook output priority 0;
    policy accept;
  }
}
