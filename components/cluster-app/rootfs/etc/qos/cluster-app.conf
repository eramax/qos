# QOS cluster-app configuration
# Uncomment and set values here, or provide via environment variables:
#   CF_DNS_API_TOKEN=xxx qos-cluster-app enable
# Values can also be entered interactively when running:
#   qos-cluster-app enable

# Ingress hostname for the cluster-info dashboard
# Example: info.sv3.example.com
#CLUSTER_INFO_HOST=

# Cloudflare API token for Let's Encrypt DNS-01 wildcard certificates
# Create at: Cloudflare → My Profile → API Tokens → Create Token
# Permissions needed: Zone → DNS → Edit (for your zone)
#CF_DNS_API_TOKEN=
