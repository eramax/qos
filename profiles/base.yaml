name: base
kernel:
  base_config: components/kernel/kernel/x86_64.config
  fragments: []
qemu:
  command: QOS_PROFILE=base QEMU_DISPLAY=none QEMU_MEMORY=1G QEMU_CPUS=2 QEMU_NET_MODE=tap QEMU_BRIDGE_IFACE=br0 QEMU_HOSTFWD_PORT=2222 builder/tools/boot-image.sh --qemu-iso dist/qos-base.iso
components:
  - apk
  - core
  - kernel
  - networking
  - dropbear
  - nftables
  - qemu-guest-agent
  - zram
  - console
  - mdev-coldplug
  - dns
  - webapp
  - reverse-proxy
  - capabilities
  - qos-banner
  - qos
  - syslog
  - btop
