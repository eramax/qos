# Dropbear runtime policy for the minimal server image.
# Password login and direct root access are allowed (per security model).
# All port forwarding is disabled for security.
# Idle timeout prevents resource exhaustion from abandoned sessions.
# -g: disable password login for root (keys only)
# -j: disable local port forwarding
# -I 300: idle timeout in seconds (5 minutes)
# -k: disable remote port forwarding
DROPBEAR_EXTRA_ARGS="-g -j -k -I 300"
