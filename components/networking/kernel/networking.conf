# Networking stack, nftables firewall, device drivers, and virtio transport

# ============================================================
# Networking Core
# ============================================================
CONFIG_NET=y
CONFIG_PACKET=y
CONFIG_PACKET_DIAG=y
CONFIG_NETLINK=y
CONFIG_NETLINK_DIAG=y
CONFIG_UNIX_SCM=y
CONFIG_INET=y
CONFIG_IP_MULTICAST=y
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y
CONFIG_INET_AH=n
CONFIG_INET_ESP=n
CONFIG_IPV6=y
CONFIG_IPV6_MULTIPLE_TABLES=y
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y

# nftables (host firewall)
CONFIG_NF_CONNTRACK=y
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NF_CONNTRACK_ZONES=y
CONFIG_NF_TABLES=y
CONFIG_NFT_COMPAT=n
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=y
CONFIG_NFT_COUNTER=y
CONFIG_NFT_LOG=y
CONFIG_NFT_LIMIT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_REDIR=y
CONFIG_NFT_NAT=y
CONFIG_NFT_FIB_IPV4=y
CONFIG_NFT_FIB_IPV6=y

# TCP optimizations
CONFIG_TCP_CONG_BBR=y
CONFIG_TCP_CONG_CUBIC=y
CONFIG_DEFAULT_TCP_CONG="bbr"
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_NET_SCH_PFIFO_FAST=y

# ============================================================
# Network Devices (built-in: virtio for QEMU)
# ============================================================
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y

# QEMU virtio (built-in for boot)
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_VIRTIO_BALLOON=y
CONFIG_VIRTIO_MMIO=n
CONFIG_VIRTIO_PCI_LEGACY=y

# Real hardware drivers explicitly disabled for now;
# enable per-target hardware by adding =m entries here.
CONFIG_E1000=n
CONFIG_E1000E=n
CONFIG_IXGBE=n
CONFIG_IGB=n
CONFIG_IGB_HWMON=n
CONFIG_R8169=n
CONFIG_BNX2X=n
CONFIG_TIGON3=n
