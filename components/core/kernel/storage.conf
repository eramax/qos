# Storage device drivers and block device configuration

# ============================================================
# Storage (virtio built-in, real hardware as modules)
# ============================================================
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_SR=y
CONFIG_SCSI_VIRTIO=y

# Real hardware storage (modules)
CONFIG_ATA=y
CONFIG_ATA_PIIX=y
CONFIG_AHCI=m
CONFIG_LIBATA=y
CONFIG_ATA_ACPI=y
CONFIG_SATA_AHCI=y
CONFIG_NVME_CORE=m
CONFIG_BLK_DEV_NVME=m

# ============================================================
# I/O Schedulers
# ============================================================
CONFIG_MQ_DEFAULT=y
CONFIG_BFQ_GROUP_IOSCHED=y
CONFIG_IOSCHED_BFQ=y
CONFIG_IOSCHED_NONE=y
CONFIG_DEFAULT_BFQ=y
CONFIG_DEFAULT_IOSCHED="bfq"
