# Open-source GPU stack used by the desktop profile.

# Firmware loader (needed for GPU firmware blobs shipped in linux-firmware-* apk packages)
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_USER_HELPER=n
CONFIG_EXTRA_FIRMWARE=""

# Core DRM stack (promoted from base where they were =m or disabled)
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_ATOMIC=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_VGA_CONSOLE=n
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=n

# GPU drivers
CONFIG_DRM_VIRTIO_GPU=y
CONFIG_DRM_VIRTIO_GPU_COHERENT=y
CONFIG_DRM_I915=y
CONFIG_DRM_AMDGPU=y
CONFIG_DRM_RADEON=y
CONFIG_DRM_NOUVEAU=y

# Hypervisor/virtualization
CONFIG_HYPERVISOR_GUEST=y
CONFIG_VMWARE_VMCI=y
CONFIG_VIRT_DRIVERS=y
CONFIG_VBOXGUEST=m
CONFIG_DRM_VMWGFX=y
CONFIG_DRM_VMWGFX_FBC=y
