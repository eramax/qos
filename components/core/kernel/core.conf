# Core kernel features: container isolation, process management, security

# ============================================================
# Cgroups v2 (resource isolation)
# ============================================================
CONFIG_CGROUPS=y
CONFIG_CGROUP2=y
CONFIG_CPUSETS=y
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_BPF=y

# ============================================================
# Namespaces (container isolation)
# ============================================================
CONFIG_NAMESPACES=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_TIME_NS=y

# ============================================================
# IPC & Async I/O
# ============================================================
CONFIG_SYSVIPC=y
CONFIG_SYSVIPC_SYSCTL=y
CONFIG_POSIX_MQUEUE=y
CONFIG_POSIX_MQUEUE_SYSCTL=y
CONFIG_IO_URING=y
CONFIG_FUTEX=y
CONFIG_FUTEX_PI=y
CONFIG_AIO=y
CONFIG_EPOLL=y
CONFIG_EVENTFD=y
CONFIG_MEMFD_CREATE=y
CONFIG_UNIX=y
CONFIG_UNIX_DIAG=y

# ============================================================
# Scheduler (high-performance multicore)
# ============================================================
CONFIG_SCHED_SMT=y
CONFIG_SCHED_MC=y
CONFIG_SCHED_CLUSTER=y
CONFIG_NUMA=y
CONFIG_NUMA_BALANCING=y
CONFIG_X86_64_ACPI_NUMA=y
CONFIG_PREEMPT_DYNAMIC=y
CONFIG_PREEMPT_VOLUNTARY=y
CONFIG_SCHED_CORE=n
CONFIG_SCHED_AUTOGROUP=n
CONFIG_HZ_250=y
CONFIG_NO_HZ_IDLE=y
CONFIG_NO_HZ_FULL=n
CONFIG_UCLAMP_TASK=n

# RCU optimizations for multicore
CONFIG_TREE_RCU=y
CONFIG_RCU_EXPERT=y
CONFIG_RCU_FANOUT=64
CONFIG_RCU_FANOUT_LEAF=16
CONFIG_RCU_BOOST=n
CONFIG_RCU_NOCB_CPU=n

# ============================================================
# Interrupt Handling
# ============================================================
CONFIG_IRQ_FORCED_THREADING=y
CONFIG_GENERIC_IRQ_PROBE=y
CONFIG_AUTO_IRQ_AFFINITY=y

# ============================================================
# Security & Capabilities
# ============================================================
CONFIG_SECURITY=y
CONFIG_SECURITYFS=y
CONFIG_SECURITY_YAMA=n
CONFIG_SECURITY_LANDLOCK=n
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_AUDIT=n
CONFIG_AUDITSYSCALL=n
CONFIG_AUDIT_WATCH=n
CONFIG_AUDIT_TREE=n

# Stack protection
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_VMAP_STACK=y
CONFIG_REFCOUNT_FULL=n

# ============================================================
# Watchdog (for server reliability)
# ============================================================
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_WATCHDOG_NOWAYOUT=y
CONFIG_SOFT_WATCHDOG=y
